if(!rows.length)return toast('أضف صنفاً واحداً على الأقل',1);const seen={};

const old=h?rits(h):[],keep=rows.map(x=>x.b).filter(Boolean);
for(const b of old){const used=db.ops.some(o=>o.batch===b.no)||db.recall.some(o=>o.batch===b.no),x=rows.find(y=>y.b===b.id);if(!x&&used)return toast('لا يمكن حذف التشغيلة '+b.no+': عليها حركات أو استدعاء',1);if(x&&x.no!==b.no&&used)return toast('لا يمكن تغيير رقم تشغيلة عليها حركات: '+b.no,1);if(x&&bal(b)+(+x.qty-(+b.qty))<0)return toast('الكمية أقل من المصروف للتشغيلة '+b.no,1)}
const oldSt=h?h.status:null;let rec=h,held=0;if(h)Object.assign(h,H,{s:0});else{rec={id:uid(),cr:new Date().toISOString(),by:me.n,s:0,...H};db.rcv.push(rec)}

if(o)Object.assign(o,d,{s:0});else{const nb={id:uid(),cr:new Date().toISOString(),by:me.n,s:0,...d};if(p&&p.min!==''&&(+H.rt<+p.min||+H.rt>+p.max)){nb.status='محجوز';held++;autoNcr(nb,'حرارة استلام التشغيلة '+nb.no+' خارج حد '+nb.prod+': '+H.rt+'°م')}db.batches.push(nb)}});
